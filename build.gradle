plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
group = 'com.tate.lookoutawning'
version = '1.0.0'
base { archivesName = 'lookout-awning' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1'
    runs { client { workingDirectory project.file('run'); mods { lookoutawning { source sourceSets.main } } }
           server { workingDirectory project.file('run'); mods { lookoutawning { source sourceSets.main } } } }
}
repositories { maven { url = 'https://maven.minecraftforge.net' } }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.23' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
