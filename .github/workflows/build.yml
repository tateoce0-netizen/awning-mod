name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Manual Version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0' # Installs a standard Gradle 8.0 directly on the cloud server

      - name: Build with Gradle
        run: gradle build # Uses the server-installed gradle instead of looking for ./gradlew

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LookoutAwning-Jar
          path: build/libs/
